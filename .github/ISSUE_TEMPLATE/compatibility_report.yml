name: Compatibility report
description: Tell us how the integration works with your player, whether it works or not.
title: "Compatibility: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        The integration has been tested on the **LP10** only, so reports from other Arylic models,
        and from the LP10 on other firmware versions, are especially valuable. Confirmed results
        are added to the README's
        [tested hardware](https://github.com/biddies4africa/ha-arylic-lp#tested-hardware) table.
  - type: input
    id: model
    attributes:
      label: Player model
      placeholder: LP10
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Player firmware
      description: Shown as **Firmware** on the player's device page in Home Assistant.
      placeholder: AR241CP_8285.9.1
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Discovered automatically
        - Added by IP address
        - Setup failed
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      description: Tick each feature you tested and found working. Leave the others unticked.
      options:
        - label: Shows as playing with Spotify Connect
        - label: Shows as playing with AirPlay
        - label: Shows as playing with Google Cast
        - label: Shows as playing with TIDAL Connect
        - label: Shows as playing with Bluetooth
        - label: Shows as playing with line in
        - label: Volume and mute
        - label: Source selection
        - label: Play/pause and next/previous track
        - label: Bass, mid and treble
        - label: Virtual bass
        - label: LED
        - label: Auto-power (the plug switches on and off)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that didn't work, or behaved unexpectedly.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        On the player's device page, open the **⋮** menu and select **Download diagnostics**,
        then drag the file here. It leaves out the player's address, MAC address and time zone.
