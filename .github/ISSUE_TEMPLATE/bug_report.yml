name: Bug report
description: Report something that isn't working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Many common problems are covered in the
        [troubleshooting section](https://github.com/biddies4africa/ha-arylic-lp/blob/main/docs/user-guide.md#8-troubleshooting)
        of the user guide, so it's worth checking there first.
  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: What you did, what you expected to happen, and what happened instead.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Player model
      placeholder: LP10
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Player firmware
      description: Shown as **Firmware** on the player's device page in Home Assistant.
      placeholder: AR241CP_8285.9.1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What was playing
      description: Select all that apply, if the problem is related to playback.
      multiple: true
      options:
        - Spotify Connect
        - AirPlay
        - Google Cast
        - TIDAL Connect
        - Internet radio
        - Bluetooth
        - Line in
        - USB
        - Not related to playback
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        On the player's device page, open the **⋮** menu and select **Download diagnostics**,
        then drag the file here. It leaves out the player's address, MAC address and time zone.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Any relevant entries from **Settings** > **System** > **Logs**. For more detail, open
        **Arylic - LP Series** under **Devices & services**, select **⋮** > **Enable debug logging**,
        and reproduce the problem. Disabling debug logging then downloads the log.
      render: text
